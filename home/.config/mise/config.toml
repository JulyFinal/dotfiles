[tools]
go = "latest"
node = "26"
npm = "12"
rust = "stable"
uv = "latest"
bat = "latest"
deno = "latest"
fzf = "latest"
fd = "latest"
jq = "latest"
navi = "latest"
rclone = "latest"
ruff = "latest"
shfmt = "latest"
starship = "latest"
stylua = "latest"
taplo = "latest"
ty = "latest"
yazi = "latest"
yq = "latest"
zoxide = "latest"
agy = "latest"
lua-language-server = "latest"
neovim = "latest"
herdr = "latest"
codex = "latest"
pi = "latest"
tree-sitter = "latest"
vercel = { version = "latest", allow_builds = ["esbuild"], trust_policy_excludes = ["undici"] }
python = "3.15"
superfile = "latest"
"npm:cf" = "latest"
"npm:@deepseek-ai/dsh" = "latest"
cargo-binstall = "latest"
atuin = { version = "latest", libc = "musl" }

[env]
GOPATH = "{{env.HOME}}/.local/share/go"
GOBIN = "{{env.HOME}}/.local/bin"

[settings]
minimum_release_age = "0"
http_timeout = "60"

[settings.npm]
package_manager = "npm"

# [settings.url_replacements]
# 代理 GitHub Release 和 Archive 下载
# 'regex:^https://github\.com/' = 'https://gh-proxy.com/https://github.com/'
# 单独代理 GitHub API 请求
# 'regex:^https://api\.github\.com/' = 'https://gh-proxy.com/https://api.github.com/'
