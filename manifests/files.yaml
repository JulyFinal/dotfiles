version: 1

# This is the deployment menu. source paths use the visible config tree and
# target paths are relative to the destination home. method defaults to link
# and mode to 0644; only exceptions need the field. template sources
# conventionally use the .j2 suffix. Omit platforms for all supported
# systems. requires names commands that must exist before rendering.
groups:
  - id: core
    label: Core configurations
  - id: personal
    label: Personal configurations

entries:
  - id: shell.bashrc
    group: core
    source: config/shell/entrypoints/bashrc
    target: .bashrc
    method: copy
  - id: shell.profile
    group: core
    source: config/shell/entrypoints/profile
    target: .profile
    method: copy
  - id: shell.zshrc
    group: core
    source: config/shell/entrypoints/zshrc
    target: .zshrc
    method: copy
  - id: tmux.config
    group: core
    source: config/shell/entrypoints/tmux.conf
    target: .tmux.conf
  - id: shell.common
    group: core
    source: config/shell/common.sh
    target: .config/shell/common.sh
  - id: shell.aliases
    group: core
    source: config/shell/aliases.sh
    target: .config/shell/aliases.sh
  - id: shell.zsh-config
    group: core
    source: config/shell/zshrc
    target: .config/shell/zshrc
  - id: starship.config
    group: core
    source: config/starship.toml
    target: .config/starship.toml
  - id: navi.personal-cheat
    group: core
    source: config/navi/cheats/personal.cheat
    target: .local/share/navi/cheats/personal.cheat
  - id: mise.config
    group: core
    source: config/mise/config.toml
    target: .config/mise/config.toml
  - id: mise.skills-task
    group: core
    source: config/mise/tasks/skills-sync
    target: .config/mise/tasks/skills-sync

  - id: atuin.config
    group: personal
    source: config/atuin/config.toml
    target: .config/atuin/config.toml
  - id: helix.config
    group: personal
    source: config/helix/config.toml
    target: .config/helix/config.toml
  - id: helix.external-snippets
    group: personal
    source: config/helix/external-snippets.toml
    target: .config/helix/external-snippets.toml
  - id: helix.languages
    group: personal
    source: config/helix/languages.toml
    target: .config/helix/languages.toml
  - id: helix.python-snippets
    group: personal
    source: config/helix/snippets/python.toml
    target: .config/helix/snippets/python.toml
  - id: kitty.config
    group: personal
    source: config/kitty/kitty.conf
    target: .config/kitty/kitty.conf
  - id: nvim.init
    group: personal
    source: config/nvim/init.lua
    target: .config/nvim/init.lua
  - id: nvim.configs
    group: personal
    source: config/nvim/lua/configs.lua
    target: .config/nvim/lua/configs.lua
  - id: nvim.mapping
    group: personal
    source: config/nvim/lua/mapping.lua
    target: .config/nvim/lua/mapping.lua
  - id: nvim.plugins
    group: personal
    source: config/nvim/lua/plugins.lua
    target: .config/nvim/lua/plugins.lua
  - id: tealdeer.config
    group: personal
    source: config/tealdeer/config.toml
    target: .config/tealdeer/config.toml
  - id: vicinae.config
    group: personal
    source: config/vicinae/settings.json
    target: .config/vicinae/settings.json
  - id: yazi.package
    group: personal
    source: config/yazi/package.toml
    target: .config/yazi/package.toml
  - id: yazi.theme
    group: personal
    source: config/yazi/theme.toml
    target: .config/yazi/theme.toml
  - id: pi.mcp
    group: personal
    source: config/agents/pi/agent/mcp.json.j2
    target: .pi/agent/mcp.json
    method: merge-json
    mode: "0600"
    requires: [jq, minijinja-cli]
  - id: pi.settings
    group: personal
    source: config/agents/pi/agent/settings.json
    target: .pi/agent/settings.json
    method: merge-json
    mode: "0600"
    requires: [jq]
