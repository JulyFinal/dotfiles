version: 1

# This is the deployment menu. source paths use the visible config tree and
# target paths are relative to the destination home. method is link, copy, or template;
# template sources conventionally use the .j2 suffix. Omit platforms for all
# supported systems. requires names commands that must exist before rendering.
groups:
  - id: core
    label: Core configurations
  - id: personal
    label: Personal configurations

entries:
  - id: shell.bashrc
    group: core
    source: config/shell/entrypoints/bashrc
    target: .bashrc
    method: copy
    mode: "0644"
  - id: mise.config
    group: core
    source: config/mise/config.toml
    target: .config/mise/config.toml
    method: link
    mode: "0644"
  - id: mise.skills-task
    group: core
    source: config/mise/tasks/skills-sync
    target: .config/mise/tasks/skills-sync
    method: link
    mode: "0755"
  - id: shell.common
    group: core
    source: config/shell/common.sh
    target: .config/shell/common.sh
    method: link
    mode: "0644"
  - id: shell.zsh-config
    group: core
    source: config/shell/zshrc
    target: .config/shell/zshrc
    method: link
    mode: "0644"
  - id: starship.config
    group: core
    source: config/starship.toml
    target: .config/starship.toml
    method: link
    mode: "0644"
  - id: navi.personal-cheat
    group: core
    source: config/navi/cheats/personal.cheat
    target: .local/share/navi/cheats/personal.cheat
    method: link
    mode: "0644"
  - id: shell.profile
    group: core
    source: config/shell/entrypoints/profile
    target: .profile
    method: copy
    mode: "0644"
  - id: tmux.config
    group: core
    source: config/shell/entrypoints/tmux.conf
    target: .tmux.conf
    method: link
    mode: "0644"
  - id: shell.zshrc
    group: core
    source: config/shell/entrypoints/zshrc
    target: .zshrc
    method: copy
    mode: "0644"

  - id: codex.config
    group: personal
    source: config/agents/codex/config.toml.j2
    target: .codex/config.toml
    method: template
    mode: "0600"
    requires: [minijinja-cli]
